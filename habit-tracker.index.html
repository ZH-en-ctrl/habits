<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>日积 - 习惯养成</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #4CAF50;
            --primary-light: #81C784;
            --primary-dark: #388E3C;
            --accent: #FF9800;
            --bg: #F5F7FA;
            --card: #FFFFFF;
            --text: #333333;
            --text-light: #888888;
            --border: #E8E8E8;
            --shadow: 0 2px 12px rgba(0,0,0,0.08);
            --radius: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        /* 页面容器 */
        .page {
            display: none;
            padding: 20px;
            max-width: 480px;
            margin: 0 auto;
            animation: fadeIn 0.3s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 头部 */
        .header {
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
        }

        .header .date {
            color: var(--text-light);
            font-size: 14px;
            margin-top: 4px;
        }

        /* 进度卡片 */
        .progress-card {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .progress-card .label {
            font-size: 14px;
            opacity: 0.9;
        }

        .progress-card .value {
            font-size: 36px;
            font-weight: 700;
            margin: 8px 0;
        }

        .progress-bar {
            height: 8px;
            background: rgba(255,255,255,0.3);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar .fill {
            height: 100%;
            background: white;
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        /* 习惯卡片 */
        .habit-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 14px;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .habit-card:active {
            transform: scale(0.98);
        }

        .habit-card.completed {
            background: #E8F5E9;
        }

        .habit-card.completed .habit-name {
            text-decoration: line-through;
            color: var(--primary);
        }

        .habit-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        .habit-info {
            flex: 1;
            min-width: 0;
        }

        .habit-name {
            font-size: 16px;
            font-weight: 600;
        }

        .habit-streak {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 2px;
        }

        .habit-streak .fire {
            color: #FF5722;
        }

        .check-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid var(--border);
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .check-btn.checked {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        /* 计数型习惯 */
        .counter-btns {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .counter-btns button {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: white;
            font-size: 16px;
            cursor: pointer;
        }

        .counter-btns .count {
            font-size: 14px;
            font-weight: 600;
            min-width: 40px;
            text-align: center;
        }

        /* 添加按钮 */
        .fab {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            border: none;
            font-size: 28px;
            box-shadow: 0 4px 16px rgba(76,175,80,0.4);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .fab:active {
            transform: scale(0.95);
        }

        /* 底部导航 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            box-shadow: 0 -2px 12px rgba(0,0,0,0.06);
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 4px 16px;
            color: var(--text-light);
            cursor: pointer;
            border: none;
            background: none;
            font-size: 12px;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-item .icon {
            font-size: 22px;
        }

        /* 模态框 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 200;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: var(--card);
            width: 100%;
            max-width: 480px;
            border-radius: 24px 24px 0 0;
            padding: 24px;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal h2 {
            font-size: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--primary);
        }

        .icon-picker {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .icon-option {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            background: white;
        }

        .icon-option.selected {
            border-color: var(--primary);
            background: #E8F5E9;
        }

        .color-picker {
            display: flex;
            gap: 10px;
        }

        .color-option {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
        }

        .color-option.selected {
            border-color: var(--text);
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .btn {
            flex: 1;
            padding: 16px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-secondary {
            background: var(--bg);
            color: var(--text);
        }

        .btn-danger {
            background: #FFEBEE;
            color: #F44336;
        }

        /* 日历 */
        .calendar {
            background: var(--card);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .calendar-header button {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 12px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            text-align: center;
        }

        .calendar-grid .weekday {
            font-size: 12px;
            color: var(--text-light);
            padding: 8px 0;
        }

        .calendar-grid .day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
        }

        .calendar-grid .day.other {
            color: #ddd;
        }

        .calendar-grid .day.today {
            border: 2px solid var(--primary);
        }

        .calendar-grid .day.checked {
            background: var(--primary);
            color: white;
        }

        .calendar-grid .day.partial {
            background: var(--primary-light);
            color: white;
        }

        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .stat-card .number {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-card .label {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 4px;
        }

        /* 习惯管理列表 */
        .manage-list {
            background: var(--card);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .manage-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }

        .manage-item:last-child {
            border-bottom: none;
        }

        .manage-item .drag {
            color: var(--text-light);
            font-size: 20px;
        }

        .manage-item .info {
            flex: 1;
        }

        .manage-item .name {
            font-weight: 600;
        }

        .manage-item .sub {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 2px;
        }

        .manage-item .actions {
            display: flex;
            gap: 8px;
        }

        .manage-item .actions button {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: none;
            background: var(--bg);
            cursor: pointer;
            font-size: 16px;
        }

        /* 空状态 */
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }

        .empty .icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        /* 提示消息 */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 14px;
            z-index: 300;
            transition: transform 0.3s ease;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* 删除确认 */
        .delete-confirm {
            text-align: center;
            padding: 20px 0;
        }

        .delete-confirm .warning-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .delete-confirm p {
            color: var(--text-light);
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- 今日页面 -->
    <div class="page active" id="page-today">
        <div class="header">
            <h1>今天</h1>
            <div class="date" id="today-date">加载中...</div>
        </div>
        
        <div class="progress-card">
            <div class="label">今日完成度</div>
            <div class="value" id="progress-text">0/0</div>
            <div class="progress-bar">
                <div class="fill" id="progress-fill" style="width: 0%"></div>
            </div>
        </div>

        <div id="habits-list"></div>
        
        <div class="empty" id="empty-state" style="display: none;">
            <div class="icon">🌱</div>
            <p>还没有习惯，点击右下角添加</p>
        </div>
    </div>

    <!-- 统计页面 -->
    <div class="page" id="page-stats">
        <div class="header">
            <h1>统计</h1>
            <div class="date">本月概览</div>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="number" id="stat-total">0</div>
                <div class="label">总打卡天数</div>
            </div>
            <div class="stat-card">
                <div class="number" id="stat-streak">0</div>
                <div class="label">最长连续</div>
            </div>
            <div class="stat-card">
                <div class="number" id="stat-month">0</div>
                <div class="label">本月打卡</div>
            </div>
            <div class="stat-card">
                <div class="number" id="stat-rate">0%</div>
                <div class="label">完成率</div>
            </div>
        </div>

        <div class="calendar" id="calendar"></div>
    </div>

    <!-- 管理页面 -->
    <div class="page" id="page-manage">
        <div class="header">
            <h1>我的习惯</h1>
            <div class="date">长按拖动排序</div>
        </div>
        
        <div class="manage-list" id="manage-list"></div>
        
        <div class="empty" id="manage-empty" style="display: none;">
            <div class="icon">📋</div>
            <p>还没有习惯，点击右下角添加</p>
        </div>
    </div>

    <!-- 添加按钮 -->
    <button class="fab" onclick="openModal()">+</button>

    <!-- 底部导航 -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchPage('today')">
            <span class="icon">✓</span>
            <span>今日</span>
        </button>
        <button class="nav-item" onclick="switchPage('stats')">
            <span class="icon">📊</span>
            <span>统计</span>
        </button>
        <button class="nav-item" onclick="switchPage('manage')">
            <span class="icon">⚙</span>
            <span>管理</span>
        </button>
    </nav>

    <!-- 添加/编辑模态框 -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h2 id="modal-title">添加习惯</h2>
            
            <div class="form-group">
                <label>习惯名称</label>
                <input type="text" id="habit-name" placeholder="例如：每天阅读30分钟" maxlength="20">
            </div>

            <div class="form-group">
                <label>选择图标</label>
                <div class="icon-picker" id="icon-picker"></div>
            </div>

            <div class="form-group">
                <label>主题颜色</label>
                <div class="color-picker" id="color-picker"></div>
            </div>

            <div class="form-group">
                <label>打卡类型</label>
                <select id="habit-type" onchange="toggleTarget()">
                    <option value="once">每日一次</option>
                    <option value="count">多次计数</option>
                </select>
            </div>

            <div class="form-group" id="target-group" style="display: none;">
                <label>每日目标次数</label>
                <input type="number" id="habit-target" value="8" min="2" max="50">
            </div>

            <div class="form-actions">
                <button class="btn btn-secondary" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" onclick="saveHabit()">保存</button>
            </div>
        </div>
    </div>

    <!-- 删除确认模态框 -->
    <div class="modal-overlay" id="delete-modal">
        <div class="modal">
            <div class="delete-confirm">
                <div class="warning-icon">⚠️</div>
                <h3>确认删除？</h3>
                <p>删除后所有打卡记录也将被清除</p>
                <div class="form-actions">
                    <button class="btn btn-secondary" onclick="closeDeleteModal()">取消</button>
                    <button class="btn btn-danger" onclick="confirmDelete()">删除</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 提示消息 -->
    <div class="toast" id="toast"></div>

    <script>
        // ==================== 数据存储 ====================
        
        const STORAGE_KEY = 'daily_habits_v1';
        
        const ICONS = ['☀️', '💧', '📖', '🏃', '🧘', '🎸', '🎨', '💊', '🍎', '😴', '💰', '✍️', '🧹', '📵', '🎯', '⭐', '💪', '🥗', '🚿', '🦷'];
        const COLORS = ['#4CAF50', '#FF9800', '#2196F3', '#F44336', '#9C27B0', '#00BCD4', '#795548', '#607D8B', '#E91E63', '#3F51B5'];

        let habits = [];
        let records = [];
        let editingId = null;
        let deletingId = null;
        let selectedIcon = '☀️';
        let selectedColor = '#4CAF50';

        function loadData() {
            const data = localStorage.getItem(STORAGE_KEY);
            if (data) {
                const parsed = JSON.parse(data);
                habits = parsed.habits || [];
                records = parsed.records || [];
            }
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({ habits, records }));
        }

        // ==================== 初始化 ====================

        function init() {
            loadData();
            updateDate();
            renderToday();
            renderStats();
            renderManage();
            initIconPicker();
            initColorPicker();
        }

        function updateDate() {
            const now = new Date();
            const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
            const str = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 星期${weekdays[now.getDay()]}`;
            document.getElementById('today-date').textContent = str;
        }

        // ==================== 今日页面 ====================

        function renderToday() {
            const list = document.getElementById('habits-list');
            const empty = document.getElementById('empty-state');
            
            if (habits.length === 0) {
                list.innerHTML = '';
                empty.style.display = 'block';
                updateProgress(0, 0);
                return;
            }
            
            empty.style.display = 'none';
            const today = getTodayStr();
            
            list.innerHTML = habits.filter(h => h.active !== false).map(habit => {
                const todayRecords = getRecordsByDate(habit.id, today);
                const isOnce = habit.type === 'once' || !habit.type;
                const isCompleted = isOnce ? todayRecords.length > 0 : todayRecords.length >= (habit.target || 8);
                const currentCount = todayRecords.reduce((sum, r) => sum + (r.count || 1), 0);
                const streak = getStreak(habit.id);
                
                let actionHtml;
                if (isOnce) {
                    actionHtml = `<button class="check-btn ${isCompleted ? 'checked' : ''}" onclick="checkIn('${habit.id}')">
                        ${isCompleted ? '✓' : ''}
                    </button>`;
                } else {
                    const target = habit.target || 8;
                    actionHtml = `<div class="counter-btns">
                        <button onclick="changeCount('${habit.id}', -1)" ${currentCount <= 0 ? 'disabled' : ''}>−</button>
                        <span class="count">${currentCount}/${target}</span>
                        <button onclick="changeCount('${habit.id}', 1)" ${currentCount >= target ? 'disabled' : ''}>+</button>
                    </div>`;
                }
                
                return `
                    <div class="habit-card ${isCompleted ? 'completed' : ''}" style="border-left: 4px solid ${habit.color || '#4CAF50'}">
                        <div class="habit-icon" style="background: ${(habit.color || '#4CAF50')}20; color: ${habit.color || '#4CAF50'}">
                            ${habit.icon || '☀️'}
                        </div>
                        <div class="habit-info">
                            <div class="habit-name">${habit.name}</div>
                            <div class="habit-streak">
                                ${streak > 0 ? `<span class="fire">🔥</span> 连续${streak}天` : '还没开始，今天加油！'}
                            </div>
                        </div>
                        ${actionHtml}
                    </div>
                `;
            }).join('');
            
            const total = habits.filter(h => h.active !== false).length;
            const completed = habits.filter(h => h.active !== false).filter(h => {
                const tr = getRecordsByDate(h.id, today);
                if (h.type === 'count') return tr.reduce((s, r) => s + (r.count || 1), 0) >= (h.target || 8);
                return tr.length > 0;
            }).length;
            updateProgress(completed, total);
        }

        function updateProgress(completed, total) {
            document.getElementById('progress-text').textContent = `${completed}/${total}`;
            const pct = total > 0 ? (completed / total * 100) : 0;
            document.getElementById('progress-fill').style.width = pct + '%';
        }

        function checkIn(habitId) {
            const today = getTodayStr();
            const existing = getRecordsByDate(habitId, today);
            if (existing.length > 0) {
                // 取消打卡
                records = records.filter(r => !(r.habitId === habitId && r.date === today));
                saveData();
                renderToday();
                renderStats();
                return;
            }
            
            const now = new Date();
            records.push({
                id: Date.now().toString(),
                habitId,
                date: today,
                time: now.toTimeString().slice(0, 5),
                count: 1
            });
            saveData();
            renderToday();
            renderStats();
            showToast('打卡成功！🎉');
            
            // 震动反馈
            if (navigator.vibrate) navigator.vibrate(50);
        }

        function changeCount(habitId, delta) {
            const today = getTodayStr();
            const todayRecords = getRecordsByDate(habitId, today);
            const currentCount = todayRecords.reduce((sum, r) => sum + (r.count || 1), 0);
            const habit = habits.find(h => h.id === habitId);
            const target = habit?.target || 8;
            
            if (delta > 0 && currentCount >= target) return;
            if (delta < 0 && currentCount <= 0) return;
            
            if (delta < 0 && todayRecords.length > 0) {
                // 减少：删除最后一条
                const lastRecord = todayRecords[todayRecords.length - 1];
                records = records.filter(r => r.id !== lastRecord.id);
            } else if (delta > 0) {
                // 增加
                const now = new Date();
                records.push({
                    id: Date.now().toString(),
                    habitId,
                    date: today,
                    time: now.toTimeString().slice(0, 5),
                    count: 1
                });
            }
            
            saveData();
            renderToday();
            renderStats();
        }

        // ==================== 统计页面 ====================

        function renderStats() {
            const today = new Date();
            const year = today.getFullYear();
            const month = today.getMonth();
            
            // 计算统计数据
            const allDates = [...new Set(records.map(r => r.date))].sort();
            const statTotal = allDates.length;
            
            let maxStreak = 0;
            habits.forEach(h => {
                const s = getStreak(h.id, true);
                if (s > maxStreak) maxStreak = s;
            });
            
            const monthRecords = records.filter(r => {
                const d = new Date(r.date);
                return d.getFullYear() === year && d.getMonth() === month;
            });
            const statMonth = [...new Set(monthRecords.map(r => r.date))].length;
            
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysPassed = Math.min(today.getDate(), daysInMonth);
            const statRate = daysPassed > 0 ? Math.round(statMonth / daysPassed * 100) : 0;
            
            document.getElementById('stat-total').textContent = statTotal;
            document.getElementById('stat-streak').textContent = maxStreak;
            document.getElementById('stat-month').textContent = statMonth;
            document.getElementById('stat-rate').textContent = statRate + '%';
            
            renderCalendar(year, month);
        }

        function renderCalendar(year, month) {
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startPadding = firstDay.getDay();
            const daysInMonth = lastDay.getDate();
            
            const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
            const today = getTodayStr();
            
            let html = `
                <div class="calendar-header">
                    <button onclick="changeMonth(-1)">‹</button>
                    <span>${year}年${month + 1}月</span>
                    <button onclick="changeMonth(1)">›</button>
                </div>
                <div class="calendar-grid">
                    ${weekdays.map(w => `<div class="weekday">${w}</div>`).join('')}
            `;
            
            // 上月填充
            const prevLastDay = new Date(year, month, 0).getDate();
            for (let i = startPadding - 1; i >= 0; i--) {
                html += `<div class="day other">${prevLastDay - i}</div>`;
            }
            
            // 当月
            const activeHabits = habits.filter(h => h.active !== false);
            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const dayRecords = records.filter(r => r.date === dateStr);
                
                let cls = 'day';
                if (dateStr === today) cls += ' today';
                
                // 检查当天完成情况
                let completedCount = 0;
                activeHabits.forEach(h => {
                    const hRecords = dayRecords.filter(r => r.habitId === h.id);
                    if (h.type === 'count') {
                        const count = hRecords.reduce((s, r) => s + (r.count || 1), 0);
                        if (count >= (h.target || 8)) completedCount++;
                    } else if (hRecords.length > 0) {
                        completedCount++;
                    }
                });
                
                if (activeHabits.length > 0 && completedCount === activeHabits.length && completedCount > 0) {
                    cls += ' checked';
                } else if (completedCount > 0) {
                    cls += ' partial';
                }
                
                html += `<div class="${cls}">${d}</div>`;
            }
            
            // 下月填充
            const remaining = (7 - ((startPadding + daysInMonth) % 7)) % 7;
            for (let i = 1; i <= remaining; i++) {
                html += `<div class="day other">${i}</div>`;
            }
            
            html += '</div>';
            document.getElementById('calendar').innerHTML = html;
        }

        let currentCalendarMonth = new Date();

        function changeMonth(delta) {
            currentCalendarMonth.setMonth(currentCalendarMonth.getMonth() + delta);
            renderCalendar(currentCalendarMonth.getFullYear(), currentCalendarMonth.getMonth());
        }

        // ==================== 管理页面 ====================

        function renderManage() {
            const list = document.getElementById('manage-list');
            const empty = document.getElementById('manage-empty');
            
            if (habits.length === 0) {
                list.innerHTML = '';
                empty.style.display = 'block';
                return;
            }
            
            empty.style.display = 'none';
            
            list.innerHTML = habits.map((habit, index) => {
                const totalChecks = records.filter(r => r.habitId === habit.id).length;
                const typeText = habit.type === 'count' ? `每日${habit.target || 8}次` : '每日一次';
                
                return `
                    <div class="manage-item" data-id="${habit.id}">
                        <span class="drag">☰</span>
                        <div class="habit-icon" style="background: ${(habit.color || '#4CAF50')}20; color: ${habit.color || '#4CAF50'}; width: 40px; height: 40px; font-size: 20px;">
                            ${habit.icon || '☀️'}
                        </div>
                        <div class="info">
                            <div class="name">${habit.name}</div>
                            <div class="sub">${typeText} · 已打卡${totalChecks}次</div>
                        </div>
                        <div class="actions">
                            <button onclick="editHabit('${habit.id}')">✏️</button>
                            <button onclick="deleteHabit('${habit.id}')">🗑️</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ==================== 习惯CRUD ====================

        function initIconPicker() {
            const picker = document.getElementById('icon-picker');
            picker.innerHTML = ICONS.map(icon => `
                <div class="icon-option ${icon === selectedIcon ? 'selected' : ''}" onclick="selectIcon('${icon}')">
                    ${icon}
                </div>
            `).join('');
        }

        function initColorPicker() {
            const picker = document.getElementById('color-picker');
            picker.innerHTML = COLORS.map(color => `
                <div class="color-option ${color === selectedColor ? 'selected' : ''}" 
                     style="background: ${color}" 
                     onclick="selectColor('${color}')">
                </div>
            `).join('');
        }

        function selectIcon(icon) {
            selectedIcon = icon;
            document.querySelectorAll('.icon-option').forEach(el => {
                el.classList.toggle('selected', el.textContent.trim() === icon);
            });
        }

        function selectColor(color) {
            selectedColor = color;
            document.querySelectorAll('.color-option').forEach(el => {
                el.classList.toggle('selected', el.style.background === color);
            });
        }

        function toggleTarget() {
            const type = document.getElementById('habit-type').value;
            document.getElementById('target-group').style.display = type === 'count' ? 'block' : 'none';
        }

        function openModal() {
            editingId = null;
            document.getElementById('modal-title').textContent = '添加习惯';
            document.getElementById('habit-name').value = '';
            document.getElementById('habit-type').value = 'once';
            document.getElementById('habit-target').value = '8';
            toggleTarget();
            selectIcon('☀️');
            selectColor('#4CAF50');
            document.getElementById('modal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('show');
        }

        function saveHabit() {
            const name = document.getElementById('habit-name').value.trim();
            if (!name) {
                showToast('请输入习惯名称');
                return;
            }
            
            const type = document.getElementById('habit-type').value;
            const target = parseInt(document.getElementById('habit-target').value) || 8;
            
            if (editingId) {
                const habit = habits.find(h => h.id === editingId);
                if (habit) {
                    habit.name = name;
                    habit.icon = selectedIcon;
                    habit.color = selectedColor;
                    habit.type = type;
                    habit.target = target;
                }
            } else {
                habits.push({
                    id: Date.now().toString(),
                    name,
                    icon: selectedIcon,
                    color: selectedColor,
                    type,
                    target,
                    active: true,
                    createdAt: getTodayStr()
                });
            }
            
            saveData();
            closeModal();
            renderToday();
            renderManage();
            renderStats();
            showToast(editingId ? '修改成功' : '添加成功！');
        }

        function editHabit(id) {
            const habit = habits.find(h => h.id === id);
            if (!habit) return;
            
            editingId = id;
            document.getElementById('modal-title').textContent = '编辑习惯';
            document.getElementById('habit-name').value = habit.name;
            document.getElementById('habit-type').value = habit.type || 'once';
            document.getElementById('habit-target').value = habit.target || 8;
            toggleTarget();
            selectIcon(habit.icon || '☀️');
            selectColor(habit.color || '#4CAF50');
            document.getElementById('modal').classList.add('show');
        }

        function deleteHabit(id) {
            deletingId = id;
            document.getElementById('delete-modal').classList.add('show');
        }

        function closeDeleteModal() {
            document.getElementById('delete-modal').classList.remove('show');
            deletingId = null;
        }

        function confirmDelete() {
            if (!deletingId) return;
            habits = habits.filter(h => h.id !== deletingId);
            records = records.filter(r => r.habitId !== deletingId);
            saveData();
            closeDeleteModal();
            renderToday();
            renderManage();
            renderStats();
            showToast('已删除');
        }

        // ==================== 工具函数 ====================

        function getTodayStr() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function getRecordsByDate(habitId, date) {
            return records.filter(r => r.habitId === habitId && r.date === date);
        }

        function getStreak(habitId, allTime = false) {
            const habitRecords = records.filter(r => r.habitId === habitId);
            const dates = [...new Set(habitRecords.map(r => r.date))].sort().reverse();
            
            if (dates.length === 0) return 0;
            
            const today = getTodayStr();
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            const yestStr = `${yesterday.getFullYear()}-${String(yesterday.getMonth() + 1).padStart(2, '0')}-${String(yesterday.getDate()).padStart(2, '0')}`;
            
            let streak = 0;
            let checkDate = new Date();
            
            // 检查今天是否打卡
            const habit = habits.find(h => h.id === habitId);
            const todayRecords = getRecordsByDate(habitId, today);
            let todayCompleted = false;
            if (habit?.type === 'count') {
                todayCompleted = todayRecords.reduce((s, r) => s + (r.count || 1), 0) >= (habit.target || 8);
            } else {
                todayCompleted = todayRecords.length > 0;
            }
            
            if (todayCompleted) {
                streak = 1;
                checkDate.setDate(checkDate.getDate() - 1);
            } else if (dates[0] === yestStr) {
                checkDate.setDate(checkDate.getDate() - 1);
            } else {
                return 0;
            }
            
            while (true) {
                const dateStr = `${checkDate.getFullYear()}-${String(checkDate.getMonth() + 1).padStart(2, '0')}-${String(checkDate.getDate()).padStart(2, '0')}`;
                const dayRecords = getRecordsByDate(habitId, dateStr);
                let completed = false;
                if (habit?.type === 'count') {
                    completed = dayRecords.reduce((s, r) => s + (r.count || 1), 0) >= (habit.target || 8);
                } else {
                    completed = dayRecords.length > 0;
                }
                
                if (completed) {
                    streak++;
                    checkDate.setDate(checkDate.getDate() - 1);
                } else {
                    break;
                }
            }
            
            return streak;
        }

        function switchPage(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById(`page-${page}`).classList.add('active');
            event.target.closest('.nav-item').classList.add('active');
            
            if (page === 'stats') renderStats();
            if (page === 'manage') renderManage();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // 点击遮罩关闭
        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
        document.getElementById('delete-modal').addEventListener('click', function(e) {
            if (e.target === this) closeDeleteModal();
        });

        // 启动
        init();
    </script>
</body>
